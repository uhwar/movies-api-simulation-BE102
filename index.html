<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Movies</title>
<style>
  :root{--bg:#0f1220;--card:#1a1f35;--ink:#e7e9f3;--muted:#9aa3c7;--accent:#6c8cff;--line:#2a3050;--ok:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{font-size:20px;margin:0;flex:1}
  #status{font:13px ui-monospace,monospace;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  #status b{color:var(--ok)} #status.err b{color:var(--bad)}
  main{max-width:900px;margin:0 auto;padding:24px;display:grid;gap:18px}
  .bar{display:flex;gap:10px;flex-wrap:wrap}
  input{font:inherit;background:#0c0f1c;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h3{margin:0 0 4px;font-size:16px}
  .meta{color:var(--muted);font-size:14px}
  .badge{display:inline-block;margin:10px 0;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.seen{color:var(--ok);border-color:var(--ok)}
  .card button{display:block;background:transparent;color:var(--muted);border:1px solid var(--line)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel.err{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
  <header><h1>🎬 My Movies</h1><span id="status">ready</span></header>
  <main>
    <div class="bar">
      <input id="lookup" type="number" placeholder="Look up a movie id…">
      <button onclick="openDetail($('#lookup').value)">View</button>
    </div>
    <div id="detail" class="panel" hidden></div>
    <div id="list" class="grid"></div>
  </main>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const show = (m, p, status, ok) => { const s = $("#status"); s.className = ok ? "" : "err"; s.innerHTML = `${m} ${p} → <b>${status}</b>`; };

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? {"Content-Type": "application/json"} : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => null);
    show(method, path, res.status, res.ok);
    return { status: res.status, data };
  }

  const card = m => `<div class="card">
    <h3>${esc(m.title)}</h3>
    <div class="meta">${esc(m.director)} · ${m.year}</div>
    <span class="badge ${m.watched ? "seen" : ""}">${m.watched ? "watched" : "unwatched"}</span>
    <button onclick="openDetail(${m.id})">View</button>
  </div>`;

  async function openDetail(id) {
    if (id === "" || id == null) return;
    const { status, data } = await api("GET", `/movies/${id}`);
    const d = $("#detail");
    d.hidden = false;
    if (status === 404) {
      d.className = "panel err";
      d.innerHTML = `<b>404 — not found.</b> ${esc(data?.message || data?.error || "No movie with that id.")}`;
    } else {
      d.className = "panel";
      d.innerHTML = `<h3>${esc(data.title)}</h3>
        <div class="meta">${esc(data.director)} · ${data.year} · ${data.watched ? "watched" : "unwatched"}</div>`;
    }
  }

  async function load() {
    const { data } = await api("GET", "/movies");
    const movies = data || [];
    $("#list").innerHTML = movies.length ? movies.map(card).join("") : '<p class="meta">No movies yet.</p>';
  }
  load();
</script>
</body>
</html>
